<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0a0a0a" />
    <meta
      name="description"
      content="TVLIBRES — canales de TV oficiales sin publicidad"
    />

    <title>TVLIBRES</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />

    <link rel="manifest" href="manifest.json" />
    <link rel="stylesheet" href="css/styles.css" />

    <!-- Icons -->
    <link rel="icon" type="image/svg+xml" href="icons/icon.svg" />
    <link rel="apple-touch-icon" href="icons/icon.svg" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="TVLIBRES" />
  </head>
  <body>
    <button id="theme-toggle" class="theme-toggle" type="button" aria-label="Cambiar tema">
      <svg id="icon-moon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M21.752 15.002A9.72 9.72 0 0 1 18 15.75c-5.385 0-9.75-4.365-9.75-9.75 0-1.33.266-2.597.748-3.752A9.753 9.753 0 0 0 3 11.25C3 16.635 7.365 21 12.75 21a9.753 9.753 0 0 0 9.002-5.998Z" />
      </svg>
      <svg id="icon-sun" class="hidden" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M12 3v2.25m6.364.386-1.591 1.591M21 12h-2.25m-.386 6.364-1.591-1.591M12 18.75V21m-4.773-4.227-1.591 1.591M5.25 12H3m4.227-4.773L5.636 5.636M15.75 12a3.75 3.75 0 1 1-7.5 0 3.75 3.75 0 0 1 7.5 0Z" />
      </svg>
    </button>

    <header class="app-header">
      <div class="brand">
        <span class="brand-label">Televisión · Argentina</span>
        <h1 class="app-title">TVLIBRES</h1>
        <p class="app-subtitle">Canales oficiales · sin publicidad</p>

        <div id="hero-logo-wrap" class="hero-logo-wrap">
          <div id="hero-logo" class="hero-logo">
            <svg id="hero-logo-svg" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="180" height="180">
              <rect id="cube0" x="4" y="4" width="11" height="11" rx="2" fill="#e63946" opacity="1"/>
              <rect id="cube1" x="17" y="4" width="11" height="11" rx="2" fill="#ffba08" opacity="0.7"/>
              <rect id="cube2" x="4" y="17" width="11" height="11" rx="2" fill="#219ebc" opacity="0.5"/>
              <rect id="cube3" x="17" y="17" width="11" height="11" rx="2" fill="#8ac926" opacity="0.3"/>
            </svg>
          </div>
        </div>

        <p class="app-desc">Canales de TV oficiales en una sola app.<br/>Sin publicidad, sin redirects.</p>
      </div>
      <div class="header-actions">
        <button id="install-btn" class="btn-install hidden" type="button">
          Instalar app
        </button>
        <input
          id="search"
          class="search"
          type="search"
          placeholder="Buscar canal…"
          aria-label="Buscar canal"
          autocomplete="off"
        />
      </div>
    </header>

    <main class="app-main">
      <!-- Mis Canales: user-added favorites (cards rendered by app.js, stored in localStorage) -->
      <section class="group" aria-labelledby="custom-title">
        <h2 id="custom-title" class="group-title group-title--custom">Tus favoritos</h2>

        <form id="custom-form" class="custom-form" autocomplete="off" novalidate>
          <input
            id="custom-name"
            class="custom-input"
            type="text"
            placeholder="Nombre del canal"
            aria-label="Nombre del canal"
            maxlength="80"
          />
          <input
            id="custom-url"
            class="custom-input"
            type="text"
            inputmode="url"
            placeholder="URL del stream"
            aria-label="URL del stream"
            maxlength="500"
          />
          <button id="custom-add" class="custom-add" type="submit">Agregar</button>
        </form>

        <p id="custom-error" class="custom-error hidden" role="alert"></p>

        <div id="custom-cards" class="cards"></div>
      </section>

      <div id="grid"></div>
    </main>

    <footer class="app-footer">
      <p class="footer-copy">© 2026 TVLIBRES. Todos los derechos reservados.</p>
      <a class="footer-brand" href="https://www.desarrolloweb-pdl.vercel.app" target="_blank" rel="noopener noreferrer" aria-label="DesarrolloWeb-pdl">
        <svg
          class="footer-logo"
          xmlns="http://www.w3.org/2000/svg"
          viewBox="0 0 32 32"
          width="16"
          height="16"
          aria-hidden="true"
        >
          <rect x="4" y="4" width="11" height="11" rx="2" fill="#e63946" />
          <rect x="17" y="4" width="11" height="11" rx="2" fill="#ffba08" />
          <rect x="4" y="17" width="11" height="11" rx="2" fill="#219ebc" />
          <rect x="17" y="17" width="11" height="11" rx="2" fill="#8ac926" />
        </svg>
        <span>DesarrolloWeb-pdl</span>
      </a>
    </footer>

    <!-- Player overlay -->
    <div id="player" class="player hidden" role="dialog" aria-modal="true" aria-label="Reproductor">
      <div class="player-inner">
        <button id="close-player" class="player-close" type="button" aria-label="Cerrar">✕</button>
        <div id="player-frame" class="player-frame"></div>
      </div>
    </div>

    <!-- Scroll watermark -->
    <div id="watermark" class="watermark" aria-hidden="true"></div>

    <script src="js/channels.js"></script>
    <script src="js/app.js"></script>
  </body>
</html>
